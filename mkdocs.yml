site_name: SRHarness Documentation
site_description: Long-form documentation for SRHarness and SRHarness-Engine
site_url: https://yuzhthu.github.io/SRHarness/
repo_url: https://github.com/yuzhTHU/SRHarness
repo_name: yuzhTHU/SRHarness
docs_dir: docs
dev_addr: 127.0.0.1:8001
strict: true
nav:
  - Overview: index.md
  - Install: install.md
  - Quick Start: quick-start.md
  - SRHarness: sr-harness.md
  - SRHarness 智能体工作流: agent.md
  - SRHarness 核心抽象: core-abstractions.md
  - context.data 数据格式: context-data.md
  - SRHarness 网页工作台: web-ui.md
  - SRHarness 符号引擎: engine.md
  - API Reference: reference/index.md
theme:
  name: material
  language: zh
  features:
    - content.code.copy
    - navigation.top
    - search.highlight
    - search.suggest
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
          site_name: SRHarness 文档
          site_description: SRHarness 与 SRHarness 符号引擎的使用文档
        - locale: en
          name: English
          build: true
          site_name: SRHarness Documentation
          site_description: Documentation for SRHarness and SRHarness Engine
          nav:
            - Overview: index.md
            - Install: install.md
            - Quick Start: quick-start.md
            - SRHarness: sr-harness.md
            - SRHarness Agent Workflow: agent.md
            - SRHarness Core Abstractions: core-abstractions.md
            - context.data Format: context-data.md
            - SRHarness WebUI: web-ui.md
            - SRHarness Engine: engine.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            filters:
              - "!^_"
            inherited_members: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            signature_crossrefs: true
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/log-output.js
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
