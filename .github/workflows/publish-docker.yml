name: Publish Docker image

on:
  push:
    branches:
      - master
    paths:
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-docker
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
      version: ${{ steps.changes.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect project version change
        id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          publish = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          current = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not publish:
              before = os.environ["BEFORE"]
              previous_source = subprocess.check_output(
                  ["git", "show", f"{before}:pyproject.toml"], text=True,
              )
              previous = tomllib.loads(previous_source)["project"]["version"]
              publish = current != previous
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"publish={str(publish).lower()}", file=output)
              print(f"version={current}", file=output)
          PY

  publish:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: yumeoww
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            yumeoww/sr-harness:${{ needs.changes.outputs.version }}
            yumeoww/sr-harness:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/yuzhTHU/SRHarness
            org.opencontainers.image.revision=${{ github.sha }}
